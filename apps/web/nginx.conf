server {
    listen 80;
    root /usr/share/nginx/html;

    # Lo mismo que hace el proxy de Vite en desarrollo: la web y la API en la misma dirección.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Las planillas del padrón pesan hasta 2 MB.
        client_max_body_size 5m;
    }

    # Las rutas las resuelve React Router: cualquier dirección que no sea un archivo abre la web.
    location / {
        try_files $uri /index.html;
    }
}
