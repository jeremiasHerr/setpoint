<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Pintura · Última luz · noche clara</title>
<style>
html,body{margin:0;background:#161616;overflow:hidden}
#c{display:block;height:100vh;width:auto;margin:0 auto}
#c.det{position:absolute;margin:0;height:auto}
#g{position:absolute;left:0;top:0;pointer-events:none;display:none}
</style></head><body>
<canvas id="c"></canvas><canvas id="g"></canvas>
<script>
'use strict';
// Última luz: el club a la tardecita, cuando se prenden las luces de la cancha.
// Noche clara: el mismo cuadro con el cielo levantado a un azul pizarra, para que no se funda con la página oscura.
// Pintado por capas con pinceles propios. Determinista: misma semilla, misma pintura.
const W = 2400, H = 2400, T0 = performance.now();
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const MAIN = cv.getContext('2d'); let ctx = MAIN;

// ---------------------------------------------------------------- azar y ruido
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
let R = mulberry32(20261116);
const rnd = (a=0,b=1) => a+(b-a)*R(), rint = (a,b) => Math.floor(rnd(a,b+1));
const clamp = (v,a=0,b=1) => v<a?a:v>b?b:v, lerp = (a,b,t) => a+(b-a)*t;
const sstep = (a,b,x) => { const t=clamp((x-a)/(b-a)); return t*t*(3-2*t); };
function hash(x,y,s){ let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1442695041); h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967296; }
function vn(x,y,s=0){ const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf); const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y,s=0,o=4){ let t=0,a=.5,f=1,n=0; for(let i=0;i<o;i++){ t+=a*vn(x*f,y*f,s+i*31); n+=a; f*=2; a*=.5; } return t/n; }

// ---------------------------------------------------------------- color
const C = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix = (a,b,t) => [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const css = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${clamp(a).toFixed(3)})`;
const jc = (c,n) => [clamp(c[0]+(R()-.5)*2*n,0,255),clamp(c[1]+(R()-.5)*2*n,0,255),clamp(c[2]+(R()-.5)*2*n,0,255)];
const cdist = (a,b) => Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);
function ramp(st,t){ if(t<=st[0][0]) return st[0][1]; for(let i=1;i<st.length;i++) if(t<=st[i][0]){ const k=(t-st[i-1][0])/(st[i][0]-st[i-1][0]); return mix(st[i-1][1],st[i][1],k); } return st[st.length-1][1]; }
const RS = a => a.map(([t,h]) => [t,C(h)]);

// ---------------------------------------------------------------- capas
function capa(){ const c=document.createElement('canvas'); c.width=W; c.height=H; return c.getContext('2d'); }
const LA = capa(), LB = capa();
function limpiar(l){ l.setTransform(1,0,0,1,0,0); l.globalCompositeOperation='source-over'; l.globalAlpha=1; l.filter='none'; l.clearRect(0,0,W,H); }
function volcarEn(dest,l,op='source-over',a=1){ dest.save(); dest.globalCompositeOperation=op; dest.globalAlpha=a; dest.drawImage(l.canvas,0,0); dest.restore(); }
function volcar(l,op='source-over',a=1){ volcarEn(ctx,l,op,a); }

// Diente del papel: los valles del grano no toman el lápiz.
const GRANO = (() => {
  const s=1200, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d'), id=g.createImageData(s,s), d=id.data;
  for(let y=0;y<s;y++) for(let x=0;x<s;x++){
    const n = vn(x*.8,y*.8,3)*.45 + hash(x,y,9)*.3 + vn(x*.1+y*.04,y*.22-x*.05,5)*.25;
    d[(y*s+x)*4+3] = clamp((n-.38)*2.3)*255;
  }
  g.putImageData(id,0,0);
  const G=document.createElement('canvas'); G.width=W; G.height=H; G.getContext('2d').drawImage(c,0,0,W,H); return G;
})();
function diente(l,k){ l.save(); l.setTransform(1,0,0,1,0,0); l.globalCompositeOperation='destination-out'; l.globalAlpha=k; l.drawImage(GRANO,0,0); l.restore(); }

// ---------------------------------------------------------------- geometría con pulso
function remuestrear(p,paso){
  const o=[];
  for(let i=0;i<p.length-1;i++){ const a=p[i],b=p[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1])||1,nx=-(b[1]-a[1])/L,ny=(b[0]-a[0])/L,k=Math.max(1,Math.round(L/paso)); for(let j=0;j<k;j++){ const t=j/k; o.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t),nx,ny]); } }
  const a=p[p.length-2],b=p[p.length-1],L=Math.hypot(b[0]-a[0],b[1]-a[1])||1; o.push([b[0],b[1],-(b[1]-a[1])/L,(b[0]-a[0])/L]); return o;
}
function aspero(p,amp=2,paso=7,s=1){ const q=remuestrear([...p,p[0]],paso); q.pop(); return q.map(([x,y,nx,ny]) => { const d=(vn(x*.035,y*.035,s)-.5)*2*amp+(R()-.5)*amp*.6; return [x+nx*d,y+ny*d]; }); }
function camino(p,path){ const P=path||new Path2D(); P.moveTo(p[0][0],p[0][1]); for(let i=1;i<p.length;i++) P.lineTo(p[i][0],p[i][1]); P.closePath(); return P; }
function mancha(cx,cy,rx,ry,irr=.15,s=1,rot=0){ const n=Math.max(16,Math.round((rx+ry)/4)),p=[],cr=Math.cos(rot),sr=Math.sin(rot); for(let i=0;i<n;i++){ const a=i/n*6.2832,k=1+irr*((vn(Math.cos(a)*1.6+s*3.1,Math.sin(a)*1.6+s*1.7,s)-.5)*2)+(R()-.5)*irr*.25,x=Math.cos(a)*rx*k,y=Math.sin(a)*ry*k; p.push([cx+x*cr-y*sr,cy+x*sr+y*cr]); } return p; }

// Gouache: el mismo polígono en varias manos, cada una con el borde un poco distinto.
function gouache(l,p,col,o={}){
  const capas=o.capas||3, amp=o.amp??2.2, a=o.a??1;
  for(let i=0;i<capas;i++){ const q=aspero(p,amp*(1+i*.45),o.paso||7,rint(1,9999)); l.fillStyle=css(jc(col,o.var??4),i===0?a:a*(o.ab??.35)); l.fill(camino(q)); }
  if(o.borde){ const q=aspero(p,amp,o.paso||7,rint(1,9999)); l.strokeStyle=css(o.borde,o.ba??.3); l.lineWidth=o.bw??2; l.lineJoin='round'; l.stroke(camino(q)); }
}

// Rayado de lápiz: trazos paralelos, cortados, con largo y presión variables.
function rayado(l,o){
  const ca=Math.cos(o.ang),sa=Math.sin(o.ang),cx=(o.x0+o.x1)/2,cy=(o.y0+o.y1)/2,dg=Math.hypot(o.x1-o.x0,o.y1-o.y0)/2+10, gl=o.gapL||[6,60];
  l.lineCap='round';
  for(let s=-dg;s<dg;s+=o.gap*rnd(.55,1.45)){
    const px=cx-sa*s,py=cy+ca*s; let t=-dg-rnd(0,o.len[1]);
    while(t<dg){
      const len=rnd(o.len[0],o.len[1]), x1=px+ca*t,y1=py+sa*t,x2=x1+ca*len,y2=y1+sa*len,mx=(x1+x2)/2,my=(y1+y2)/2;
      if(mx>o.x0-len/2&&mx<o.x1+len/2&&my>o.y0-len/2&&my<o.y1+len/2&&R()>(o.skip||0)){
        const c=o.col(mx,my,x1,y1,x2,y2);
        if(c){ const b=(R()-.5)*len*(o.curve??.05), al=rnd(o.a[0],o.a[1])*(c.length>3?c[3]:1);
          l.strokeStyle=css(c,al); l.lineWidth=rnd(o.w[0],o.w[1]);
          l.beginPath(); l.moveTo(x1,y1); l.quadraticCurveTo(mx-sa*b,my+ca*b,x2,y2); l.stroke();
          if(o.doble&&len>30){ l.lineWidth*=.5; l.strokeStyle=css(c,al*.6); l.beginPath(); l.moveTo(x1+ca*len*.12,y1+sa*len*.12+1.3); l.lineTo(x2-ca*len*.18,y2-sa*len*.18+1.3); l.stroke(); }
        }
      }
      t+=len+rnd(gl[0],gl[1]);
    }
  }
}
// Lápiz encima de lo pintado: toma el color de abajo y lo corre hacia un tono.
function lapiz(o){
  const x0=Math.max(0,Math.floor(o.bb[0])),y0=Math.max(0,Math.floor(o.bb[1])),x1=Math.min(W,Math.ceil(o.bb[2])),y1=Math.min(H,Math.ceil(o.bb[3])),w=x1-x0,h=y1-y0;
  const img=ctx.getImageData(x0,y0,w,h).data;
  const sm=(x,y)=>{ x=clamp(Math.round(x)-x0,0,w-1); y=clamp(Math.round(y)-y0,0,h-1); const i=(y*w+x)*4; return [img[i],img[i+1],img[i+2]]; };
  limpiar(LA); LA.save(); if(o.clip) LA.clip(o.clip);
  rayado(LA,{x0,y0,x1,y1,ang:o.ang,gap:o.gap,len:o.len,w:o.w,a:o.a,curve:o.curve,skip:o.skip,gapL:o.gapL,doble:o.doble,
    col:(mx,my,ax,ay,bx,by)=>{ const c=sm(mx,my); if(o.corte&&(cdist(sm(ax,ay),c)>o.corte||cdist(sm(bx,by),c)>o.corte)) return null; return o.tono(c,mx,my); }});
  LA.restore();
  if(o.mascara){ LA.globalCompositeOperation='destination-in'; LA.drawImage(o.mascara.c,o.mascara.x0,o.mascara.y0); LA.globalCompositeOperation='source-over'; }
  if(o.diente) diente(LA,o.diente); volcar(LA,o.op||'source-over',o.alfa??1);
}
// Línea a pulso: temblor de baja frecuencia, presión, dos pasadas.
function trazo(l,pts,o){
  const P=remuestrear(pts,o.paso||5),n=P.length,w=o.w,pas=o.pas||2,a0=o.a??1;
  l.lineCap=a0<.95?'butt':'round'; l.lineJoin='round';
  for(let k=0;k<pas;k++){
    const s=rint(1,99999),off=k?rnd(-.5,.5)*w*.6:0,fw=k?rnd(.45,.7):1,aa=a0*(k?.5:1); let pr=null;
    for(let i=0;i<n;i++){
      const [x,y,nx,ny]=P[i],t=n>1?i/(n-1):0;
      const d=(vn(i*(o.f??.035),s*.01,s)-.5)*2*(o.wob??1.2)+off+(R()-.5)*(o.jit??.25), q=[x+nx*d,y+ny*d];
      if(pr){ const tp=o.taper?Math.min(1,t/.08+.2,(1-t)/.08+.2):1, pre=.72+.56*vn(i*.05,s*.02+3,s+1);
        l.lineWidth=Math.max(.4,(o.wf?o.wf(t,x,y):w)*fw*pre*tp);
        l.strokeStyle=css(o.colf?o.colf(t,x,y):o.col,aa*(.8+.2*vn(i*.13,s,7)));
        l.beginPath(); l.moveTo(pr[0],pr[1]); l.lineTo(q[0],q[1]); l.stroke(); }
      pr=q;
    }
  }
}
// Volumen en gouache: un campo de alturas da la forma, la luz la lee, y el color se pinta
// en manchas planas de pocos tonos, con el borde entre manchas movido por ruido.
function bandear(bandas,v){
  for(let b=0;b<bandas.length;b++){ if(v<bandas[b][0]){ const e=.012;
    if(b<bandas.length-1&&v>bandas[b][0]-e) return mix(bandas[b][1],bandas[b+1][1],(v-bandas[b][0]+e)/(2*e));
    return bandas[b][1]; } }
  return bandas[bandas.length-1][1];
}
function volumen(o){
  const x0=Math.floor(o.bb[0]),y0=Math.floor(o.bb[1]),x1=Math.ceil(o.bb[2]),y1=Math.ceil(o.bb[3]),w=x1-x0,h=y1-y0;
  const hf=new Float32Array(w*h);
  for(let j=0;j<h;j++) for(let i=0;i<w;i++) hf[j*w+i]=o.alto(x0+i,y0+j);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'), id=g.createImageData(w,h), d=id.data;
  let gc=null, gd=null, gid=null; if(o.brillo!=null){ gc=document.createElement('canvas'); gc.width=w; gc.height=h; gid=gc.getContext('2d').createImageData(w,h); gd=gid.data; }
  const Ll=Math.hypot(...o.luz), L=o.luz.map(v=>v/Ll), Lxy=Math.hypot(L[0],L[1])||1;
  for(let j=1;j<h-1;j++) for(let i=1;i<w-1;i++){
    const k=j*w+i, z=hf[k]; if(z<=0) continue;
    const gx=(Math.max(0,hf[k+1])-Math.max(0,hf[k-1]))*.5, gy=(Math.max(0,hf[k+w])-Math.max(0,hf[k-w]))*.5;
    let nx=-gx*(o.relieve??1), ny=-gy*(o.relieve??1), nz=1; const nl=Math.hypot(nx,ny,nz); nx/=nl; ny/=nl; nz/=nl;
    const X=x0+i, Y=y0+j;
    let v=nx*L[0]+ny*L[1]+nz*L[2];
    v+=(fbm(X*(o.fr??.018),Y*(o.fr??.018),o.s||1,3)-.5)*(o.ruido??.3)+(hash(X,Y,o.s||1)-.5)*.03;
    if(o.rim) v+=Math.pow(1-nz,1.5)*Math.max(0,(nx*L[0]+ny*L[1])/Lxy)*o.rim;
    if(o.extra) v=o.extra(v,X,Y,z,nx,ny,nz);
    const col=bandear(o.bandas,v);
    d[k*4]=col[0]; d[k*4+1]=col[1]; d[k*4+2]=col[2]; d[k*4+3]=clamp(z/(o.suave??1.4))*255;
    if(gd&&v>o.brillo){ gd[k*4]=col[0]; gd[k*4+1]=col[1]; gd[k*4+2]=col[2]; gd[k*4+3]=255; }
  }
  g.putImageData(id,0,0); if(gc) gc.getContext('2d').putImageData(gid,0,0);
  return {c,x0,y0,w,h,glow:gc};
}
function brillar(v,blur,a){ if(!v.glow) return; limpiar(LA); LA.filter=`blur(${blur}px)`; LA.drawImage(v.glow,v.x0,v.y0); LA.filter='none'; volcar(LA,'screen',a); }
function salpicar(l,x0,y0,x1,y1,n,colf,r0,r1,a0,a1){ for(let i=0;i<n;i++){ const x=rnd(x0,x1),y=rnd(y0,y1),c=colf(x,y); if(!c) continue; l.fillStyle=css(c,rnd(a0,a1)); l.beginPath(); l.arc(x,y,rnd(r0,r1),0,6.29); l.fill(); } }

// ---------------------------------------------------------------- perspectiva de la cancha
// Ojo a 2,44 m, a 2,7 m detrás de la línea de fondo. La red queda justo debajo de los botones.
const VX=1200, YH=408, F=2141, OJO=2.44, DR=14.603;
const pr = (X,d,Z=0) => [VX+F*X/d, YH+F*(OJO-Z)/d];
const dDeY = y => F*OJO/(y-YH);
const D_FONDO_LEJ=DR+11.885, D_SAQ_LEJ=DR+6.4, D_SAQ_CER=DR-6.4, D_FONDO_CER=DR-11.885, D_ALAMB=F*OJO/(466-YH), X_ALAMB=16, X_ALAMB_D=16;
const tapeY = x => 632 - 25*Math.pow((x-1200)/1056,2);   // faja de la red, con su comba
const POSTE_I=144, POSTE_D=2256, RED_BASE=766;
// zona del texto: ahí el lápiz baja la voz
const enTexto = (x,y) => x>540&&x<1860&&y>90&&y<640;
// detrás del titular el cielo queda tranquilo: misma mano, menos contraste
const calma = (x,y) => x>500&&x<1900&&y<650 ? .4 : 1;
// cuánto oscurece la viñeta radial del final en cada punto (la misma de vineta())
const vinetaA = (x,y) => .5*clamp((Math.hypot(x-1200,y-1100)-700)/1200);

// ================================================================ 1. CIELO: la última luz
// Azul pizarra de noche, que nunca llega al color de la página; abajo, la misma franja de la última luz.
const CIELO=RS([[0,'#252F45'],[70,'#28334B'],[140,'#2D3952'],[210,'#313D58'],[256,'#343F5B'],[298,'#373F5E'],[322,'#433E64'],[340,'#583F6A'],[354,'#76446C'],[366,'#9A4C68'],[378,'#BC5A62'],[388,'#E2785C'],[398,'#F59A62'],[406,'#FFB874'],[420,'#FFCB8E']]);
function colCielo(x,y){
  let c=ramp(CIELO,y+(vn(x*.003,y*.008,11)-.5)*12);
  const cen=Math.exp(-Math.pow((x-1200)/540,2));
  c=mix(c,C('#343A5E'),cen*.62*sstep(292,366,y)*(1-.5*sstep(392,410,y)));
  // las esquinas de arriba, un poco más hondas: profundidad sin volver al negro
  c=mix(c,C('#1C2538'),.45*Math.max(Math.exp(-Math.hypot(x,y*1.6)/520),Math.exp(-Math.hypot(W-x,y*1.6)/520)));
  c=mix(c,C('#FF9A5C'),(1-cen)*.38*sstep(346,404,y));
  // la viñeta del final oscurece todo como en el original; el cielo sale de antemano lo justo para quedar en su tono
  const a=vinetaA(x,y); c=c.map((v,i)=>clamp((v-[8,10,22][i]*a)/(1-a),0,255));
  return c;
}
function cielo(){
  ctx.fillStyle='#28334B'; ctx.fillRect(0,0,W,480);
  ctx.lineCap='round';
  for(let y=-10;y<485;y+=rnd(2.5,6)){
    let x=-180;
    while(x<W+100){ const len=rnd(220,760),yy=y+rnd(-3,3),c=jc(colCielo(x+len/2,yy+len*.02),4);
      ctx.strokeStyle=css(c,rnd(.3,.6)); ctx.lineWidth=rnd(7,20);
      ctx.beginPath(); ctx.moveTo(x,yy); ctx.quadraticCurveTo(x+len/2,yy+rnd(-4,4)+len*.02,x+len,yy+len*.045*rnd(.2,1)); ctx.stroke(); x+=len*rnd(.45,.85); }
  }
  for(let i=0;i<70;i++){ const x=rnd(-100,W+100),y=rnd(20,380),r=rnd(60,220); if(enTexto(x,y)&&R()<.6) continue;
    ctx.fillStyle=css(jc(colCielo(x,y+rnd(-30,30)),10),rnd(.06,.14)*calma(x,y)); ctx.fill(camino(mancha(x,y,r*1.8,r*.5,.3,i,rnd(.1,.45)))); }
}
function lapizCielo(){
  lapiz({bb:[0,0,W,470],ang:.40,gap:4.2,len:[50,240],w:[1,2],a:[.12,.30],diente:.72,gapL:[4,50],doble:true,
    tono:(c,x,y)=>[...mix(c,C('#C4D0EA'),rnd(.1,.22)),calma(x,y)]});
  lapiz({bb:[0,0,W,470],ang:-1.02,gap:7,len:[30,130],w:[.8,1.6],a:[.08,.2],diente:.8,
    tono:(c,x,y)=>[...mix(c,C('#1C2538'),.32),calma(x,y)]});
  lapiz({bb:[0,290,W,470],ang:.30,gap:3.2,len:[60,300],w:[1,2.4],a:[.16,.36],diente:.68,
    tono:(c,x,y)=>{ const k=sstep(310,408,y)*(enTexto(x,y)?.3:1); return k<.05?null:[...mix(c,C('#FFD8A8'),.22+.3*k),k]; }});
}
function estrellas(){
  limpiar(LA);
  for(let i=0;i<240;i++){ const x=rnd(0,W),y=Math.pow(R(),1.5)*300+30; if(enTexto(x,y)&&R()<.8) continue; if(y<60&&R()<.5) continue;
    LA.fillStyle=css(C('#EEF2FF'),rnd(.2,.7)*(1-y/380)); LA.beginPath(); LA.arc(x,y,rnd(.7,2.1),0,6.29); LA.fill(); }
  [[470,70],[2330,215],[95,385],[620,62],[1760,48]].forEach(([x,y],i)=>{ if(i>2&&R()<.3) return;
    const L=rnd(10,18); LA.strokeStyle=css(C('#FFF3E0'),.7); LA.lineWidth=1.3;
    LA.beginPath(); LA.moveTo(x-L,y); LA.lineTo(x+L,y); LA.moveTo(x,y-L); LA.lineTo(x,y+L); LA.stroke();
    LA.fillStyle='rgba(255,246,230,.95)'; LA.beginPath(); LA.arc(x,y,2.2,0,6.29); LA.fill(); });
  volcar(LA);
}
function cirro(x,y,len,ang,ancho,col,a){
  limpiar(LA); const ca=Math.cos(ang),sa=Math.sin(ang);
  for(let i=0;i<ancho*1.3;i++){ const off=rnd(-ancho/2,ancho/2),s0=rnd(0,len*.35),s1=rnd(len*.6,len),k=1-Math.abs(off)/(ancho/2),p=[];
    for(let j=0;j<=12;j++){ const s=lerp(s0,s1,j/12),bow=Math.sin(s/len*Math.PI)*len*.035; p.push([x+ca*s-sa*(off+bow),y+sa*s+ca*(off+bow)]); }

// Rayado que sigue la forma: cada trazo corre a lo largo de las curvas de nivel de un campo.
function rayadoForma(o){
  const x0=Math.max(0,Math.floor(o.bb[0])),y0=Math.max(0,Math.floor(o.bb[1])),x1=Math.min(W,Math.ceil(o.bb[2])),y1=Math.min(H,Math.ceil(o.bb[3])),w=x1-x0,h=y1-y0;
  const img=ctx.getImageData(x0,y0,w,h).data;
  const sm=(x,y)=>{ x=clamp(Math.round(x)-x0,0,w-1); y=clamp(Math.round(y)-y0,0,h-1); const i=(y*w+x)*4; return [img[i],img[i+1],img[i+2]]; };
  limpiar(LA); LA.lineCap='round'; LA.lineJoin='round';
  for(let i=0;i<o.n;i++){
    let x=rnd(x0,x1), y=rnd(y0,y1); if(o.campo(x,y)<=0) continue;
    const c=o.tono(sm(x,y),x,y); if(!c) continue;
    const L=rnd(o.len[0],o.len[1]), pts=[[x,y]]; let px=0,py=0;
    for(let s=0;s<L;s+=3){
      const gx=o.campo(x+2,y)-o.campo(x-2,y), gy=o.campo(x,y+2)-o.campo(x,y-2);
      let tx=-gy, ty=gx; const tl=Math.hypot(tx,ty); if(tl<1e-6) break; tx/=tl; ty/=tl;
      if(tx<0){ tx=-tx; ty=-ty; }
      if(o.base){ tx=tx*(1-o.base)+Math.cos(o.ang0||0)*o.base; ty=ty*(1-o.base)+Math.sin(o.ang0||0)*o.base; const l2=Math.hypot(tx,ty); tx/=l2; ty/=l2; }
      if(px!==0||py!==0){ if(tx*px+ty*py<0){ tx=-tx; ty=-ty; } }
      x+=tx*3; y+=ty*3; px=tx; py=ty; if(o.campo(x,y)<=0) break; pts.push([x,y]);
    }
    if(pts.length<3) continue;
    LA.strokeStyle=css(c,rnd(o.a[0],o.a[1])*(c[3]??1)); LA.lineWidth=rnd(o.w[0],o.w[1]);
    LA.beginPath(); LA.moveTo(pts[0][0],pts[0][1]); for(let k=1;k<pts.length;k++) LA.lineTo(pts[k][0],pts[k][1]); LA.stroke();
  }
  if(o.mascara){ LA.globalCompositeOperation='destination-in'; LA.drawImage(o.mascara.c,o.mascara.x0,o.mascara.y0); LA.globalCompositeOperation='source-over'; }
  if(o.diente) diente(LA,o.diente); volcar(LA);
}

// Nube suelta: pocas masas grandes, el borde de abajo encendido por el sol que ya se fue y el de arriba disuelto en el cielo.
const BANDAS_NUBE=RS([[.12,'#343E5E'],[.28,'#3F4868'],[.42,'#4F5676'],[.54,'#666486'],[.64,'#88708E'],[.73,'#AE7C88'],[.81,'#D08E7A'],[.89,'#E8A67E'],[9,'#F6C8A0']]);
function nubeSuelta(o){

  const f=new Float32Array(w*h), fs=new Float32Array(w*h);

    const X=x0+i,Y=y0+j; let m=-9;

    const gx=(hz(f[k+2])-hz(f[k-2]))/4, gy=(hz(f[k+2*w])-hz(f[k-2*w]))/4;

    if(v>.84){ gd[k*4]=col[0]; gd[k*4+1]=col[1]; gd[k*4+2]=col[2]; gd[k*4+3]=clamp(a)*255; }
  }

  rayadoForma({bb:o.bb,campo,n:o.n??Math.round(w*h/46),len:[16,55],w:[1,2],a:[.12,.32],mascara:vol,diente:.55,base:.55,ang0:.12,
    tono:cc=>R()<.55?mix(cc,C('#F2E2D6'),.2):mix(cc,C('#222A44'),.26)});

// ================================================================ 4. ALAMBRADO Y LONA
const H_LONA=1.6;
function alambrado(){
  const XS=l=>l<0?X_ALAMB:X_ALAMB_D, dMinS=l=>24;
  const dN=F*X_ALAMB/1200, dNR=F*X_ALAMB_D/1200, dMin=24;
  const lonaY=d=>YH+F*(OJO-H_LONA)/d, baseY=d=>YH+F*OJO/d;
  const xa=VX-F*X_ALAMB/D_ALAMB, xb=VX+F*X_ALAMB_D/D_ALAMB;
  const fb=baseY(D_ALAMB), nb=baseY(dN), nbR=baseY(dNR), fl=lonaY(D_ALAMB), nl=lonaY(dN);
  const postesDe=l=>{ const q=[]; for(let d=D_ALAMB;d>dMinS(l);d-=(d>50?6:3.5)) q.push(d); q.push(dMinS(l)); return q; };
  const postesX=[-16,-12,-8,-4,0,4,8,12,16];
  const SAG=.08, panos=[];
  [-1,1].forEach(lado=>{ const postesD=postesDe(lado), XX=lado*XS(lado); for(let i=0;i<postesD.length-1;i++){ const dA=postesD[i], dB=postesD[i+1], top=[], bot=[];
    for(let k=0;k<=14;k++){ const t=k/14, d=1/lerp(1/dA,1/dB,t); top.push(pr(XX,d,H_LONA-SAG*Math.sin(Math.PI*t))); bot.push(pr(XX,d,0)); }
    panos.push({top,bot,s:F/((dA+dB)/2)/100}); } });
  for(let i=0;i<postesX.length-1;i++){ const XA=postesX[i], XB=postesX[i+1], top=[], bot=[];
    for(let k=0;k<=14;k++){ const t=k/14, X=lerp(XA,XB,t); top.push(pr(X,D_ALAMB,H_LONA-SAG*Math.sin(Math.PI*t))); bot.push(pr(X,D_ALAMB,0)); }
    panos.push({top,bot,s:F/D_ALAMB/100}); }
  const poli=p=>[...p.top,...p.bot.slice().reverse()];
  const union=new Path2D(); panos.forEach(p=>camino(poli(p),union));
  const yEn=(T,x)=>{ for(let k=0;k<T.length-1;k++){ const a=T[k],b=T[k+1]; if((x-a[0])*(x-b[0])<=0) return lerp(a[1],b[1],(x-a[0])/((b[0]-a[0])||1)); } return Math.abs(x-T[0][0])<Math.abs(x-T[T.length-1][0])?T[0][1]:T[T.length-1][1]; };
  const luz=x=>clamp(Math.exp(-Math.pow((x-430)/330,2))+Math.exp(-Math.pow((x-1970)/330,2)));
  limpiar(LA); LA.lineCap='round';
  panos.forEach((p,pi)=>{
    const P=poli(p), xs=P.map(q=>q[0]), ys=P.map(q=>q[1]), xl=Math.min(...xs), xr=Math.max(...xs), yt=Math.min(...ys), yb2=Math.max(...ys), s=p.s, v0=rnd(-.1,.1);
    if(xr<-30||xl>W+30) return;
    LA.save(); LA.clip(camino(aspero(P,.8,6,pi+40)));
    LA.fillStyle='#21493A'; LA.fillRect(xl-4,yt-4,xr-xl+8,yb2-yt+8);
    for(let y=yt-4;y<yb2+4;y+=rnd(2.5,5)) for(let x=xl-20;x<xr+20;){ const len=rnd(30,150)*Math.max(.6,s), xm=x+len/2, ty=yEn(p.top,xm), by=yEn(p.bot,xm), t=clamp((y-ty)/((by-ty)||1));
      let c=mix(C('#2D6550'),C('#173A2D'),Math.pow(t,.8));
      c=mix(c,C('#3E7A5C'),clamp(luz(xm)*.55*(1-t*.7)+v0));
      if(v0<0) c=mix(c,C('#173A2D'),-v0*1.5);
      c=mix(c,C('#173A2D'),Math.exp(-Math.pow((xm-1200)/460,2))*.6);
      LA.strokeStyle=css(jc(c,5),rnd(.45,.85)); LA.lineWidth=rnd(4,10)*Math.max(.7,s); LA.beginPath(); LA.moveTo(x,y); LA.lineTo(x+len,y+rnd(-1.5,1.5)); LA.stroke(); x+=len*rnd(.5,.9); }
    // caída del género
    for(let i=0;i<(xr-xl)/14;i++){ const x=rnd(xl,xr), ty=yEn(p.top,x), by=yEn(p.bot,x); trazo(LA,[[x,ty+4*s],[x+rnd(-3,3),lerp(ty,by,rnd(.5,1))]],{w:rnd(2,5)*s,col:R()<.5?C('#183D30'):C('#3A7558'),a:.22,pas:1,wob:1,taper:true}); }
    // comba entre postes: pliegues que siguen el borde
    for(let f=0;f<3;f++){ const off=(7+f*9+rnd(-2,2))*s, pts=p.top.map(([x,y],k)=>[x,y+off*(.3+.7*Math.sin(Math.PI*k/14))]);
      trazo(LA,pts,{w:rnd(2,3.5)*s,col:C('#12302A'),a:.5-f*.12,pas:1,wob:.8,taper:true});
      trazo(LA,pts.map(([x,y])=>[x,y-2.4*s]),{w:1.4*s,col:C('#5FA07E'),a:.3-f*.07,pas:1,wob:.8,taper:true}); }
    // arrugas en V desde los amarres
    const sx=Math.sign(p.top[14][0]-p.top[0][0])||1;
    [[p.top[0],1],[p.top[14],-1]].forEach(([q,dir])=>{ for(let k=0;k<3;k++){ const L=rnd(16,40)*s, a=Math.PI/2-sx*dir*rnd(.3,.9);
      trazo(LA,[[q[0],q[1]+2*s],[q[0]+Math.cos(a)*L,q[1]+2*s+Math.sin(a)*L]],{w:rnd(1.6,2.6)*s,col:C('#12302A'),a:.5,pas:1,wob:.6,taper:true});
      trazo(LA,[[q[0]+1.5*s,q[1]+2*s],[q[0]+1.5*s+Math.cos(a)*L*.8,q[1]+2*s+Math.sin(a)*L*.8]],{w:1.2*s,col:C('#5FA07E'),a:.28,pas:1,wob:.6,taper:true}); } });
    // dobladillo y costuras
    const hem=p.top.map(([x,y])=>[x,y+6*s]);
    trazo(LA,hem,{w:1.6*s,col:C('#173D30'),a:.75,pas:1,wob:.5}); trazo(LA,hem.map(([x,y])=>[x,y-1.6*s]),{w:1*s,col:C('#76B08E'),a:.3,pas:1,wob:.5});
    [[p.top[0],p.bot[0],1],[p.top[14],p.bot[14],-1]].forEach(([a,b,k])=>{ const ox=k*sx*4*s; trazo(LA,[[a[0]+ox,a[1]],[b[0]+ox,b[1]]],{w:1.5*s,col:C('#13332A'),a:.7,pas:1,wob:.5}); trazo(LA,[[a[0]+ox*1.6,a[1]],[b[0]+ox*1.6,b[1]]],{w:1*s,col:C('#5C9C7A'),a:.25,pas:1,wob:.5}); });
    // sombra al pie
    LA.restore();
    LA.save(); LA.clip(camino(P));
    rayado(LA,{x0:xl,y0:yt,x1:xr,y1:yb2+4,ang:.02,gap:2.5,len:[40,160],w:[2,5],a:[.15,.35],col:(x,y)=>{ const by=yEn(p.bot,x), k=sstep(by-40*s,by,y); return k<.05?null:[...C('#0F271F'),k]; }});
    LA.restore();
    // ojales con sus precintos al alambre tensor
    const n=Math.max(4,Math.round(Math.hypot(p.top[14][0]-p.top[0][0],p.top[14][1]-p.top[0][1])/(9*s+6)));
    for(let j=0;j<n;j++){ const t=(j+.5)/n, kk=t*14, k0=Math.floor(kk), fr=kk-k0, a=p.top[k0], b=p.top[Math.min(14,k0+1)], x=lerp(a[0],b[0],fr), y=lerp(a[1],b[1],fr)+3.5*s;
      LA.fillStyle='rgba(214,206,190,.85)'; LA.beginPath(); LA.arc(x,y,1.7*s,0,6.29); LA.fill(); LA.fillStyle='rgba(14,30,24,.9)'; LA.beginPath(); LA.arc(x,y,.8*s,0,6.29); LA.fill();
      const up=SAG*Math.sin(Math.PI*t)*s*100+3.5*s; trazo(LA,[[x,y],[x+rnd(-1,1),y-up]],{w:1.2*s,col:C('#E6DCC8'),a:.8,pas:1,wob:.2}); }
    [p.top[0],p.top[14]].forEach(q=>{ for(let k=0;k<3;k++) trazo(LA,[[q[0]-4*s,q[1]-2*s+k*2.2*s],[q[0]+4*s,q[1]+k*2.2*s]],{w:1.3*s,col:C('#E3D6BC'),a:.85,pas:1,wob:.2}); });
  });
  diente(LA,.12); volcar(LA);
  lapiz({bb:[0,fl-10,W,nb+6],clip:union,ang:.40,gap:3.8,len:[25,120],w:[1,2],a:[.12,.3],diente:.62,doble:true,
    tono:(c,x)=>[...(R()<.6?mix(c,C('#A4D8B8'),.3):mix(c,C('#0B2019'),.35)),Math.abs(x-1200)<480?.5:1]});
  lapiz({bb:[0,fl-10,W,nb+6],clip:union,ang:Math.PI/2-.08,gap:6,len:[15,60],w:[1,1.8],a:[.08,.2],diente:.7,tono:c=>mix(c,C('#0E261E'),.3)});
  // alambrado en rombos, por delante de la lona
  limpiar(LA); LA.lineCap='round';
  const S=.3, SL=.24;
  const linea=(a,b,sl)=>{ if((a[0]<-20&&b[0]<-20)||(a[0]>W+20&&b[0]>W+20)) return;
    const near=Math.min(1,Math.min(...LAMPARAS.map(([lx,ly])=>Math.hypot((a[0]+b[0])/2-lx,((a[1]+b[1])/2-ly)*.6)))/520);
    LA.strokeStyle=sl?css(C('#A8B4AE'),.14):css(C('#141620'),.42); LA.lineWidth=sl?.9:1.05;
    LA.beginPath(); LA.moveTo(a[0]+rnd(-.5,.5),a[1]+rnd(-.5,.5)); LA.lineTo(b[0]+rnd(-.5,.5),b[1]+rnd(-.5,.5)); LA.stroke();
    if(!sl&&near<1){ LA.strokeStyle=css(C('#FFD9A6'),.24*(1-near)); LA.lineWidth=.8; LA.beginPath(); LA.moveTo(a[0]+.8,a[1]); LA.lineTo(b[0]+.8,b[1]); LA.stroke(); } };
  const tramos=[[0,H_LONA,true],[H_LONA,3,false]];
  for(let c=-X_ALAMB-3;c<=X_ALAMB_D+3;c+=S) tramos.forEach(([z0,z1,sl])=>{
    let Xa=Math.max(-X_ALAMB,c+z0), Xb=Math.min(X_ALAMB_D,c+z1); if(Xb>Xa) linea(pr(Xa,D_ALAMB,Xa-c),pr(Xb,D_ALAMB,Xb-c),sl);
    Xa=Math.max(-X_ALAMB,c-z1); Xb=Math.min(X_ALAMB_D,c-z0); if(Xb>Xa) linea(pr(Xa,D_ALAMB,c-Xa),pr(Xb,D_ALAMB,c-Xb),sl); });
  [-1,1].forEach(l=>{ const dm=dMinS(l), XX=l*XS(l); for(let c=dm-3;c<=D_ALAMB+3;c+=SL*Math.max(1,c/30)) tramos.forEach(([z0,z1,sl])=>{
    let da=Math.max(dm,c+z0), db=Math.min(D_ALAMB,c+z1); if(db>da) linea(pr(XX,da,da-c),pr(XX,db,db-c),sl);
    da=Math.max(dm,c-z1); db=Math.min(D_ALAMB,c-z0); if(db>da) linea(pr(XX,da,c-da),pr(XX,db,c-db),sl); }); });
  diente(LA,.22); volcar(LA);
  // postes, caño de arriba y alambre tensor
  const parante=(X,d)=>{ const a=pr(X,d,3.05), b=pr(X,d,0), w=clamp(F*.055/d,2.4,9); trazo(ctx,[a,b],{w,col:C('#191B2B'),a:.95,pas:1,wob:.4}); trazo(ctx,[[a[0]+w*.3,a[1]],[b[0]+w*.3,b[1]]],{w:w*.3,col:C('#B08E96'),a:.35,pas:1,wob:.3}); };
  postesX.forEach(X=>parante(X,D_ALAMB));
  [-1,1].forEach(l=>postesDe(l).forEach(d=>parante(l*XS(l),d)));
  const borde=Z=>{ const p=[]; for(let d=dMinS(-1);d<=D_ALAMB;d+=1.2) p.push(pr(-X_ALAMB,d,Z)); for(let X=-X_ALAMB;X<=X_ALAMB_D;X+=1) p.push(pr(X,D_ALAMB,Z)); for(let d=D_ALAMB;d>=dMinS(1);d-=1.2) p.push(pr(X_ALAMB_D,d,Z)); return p; };
  trazo(ctx,borde(3.05),{w:3,col:C('#181A2A'),a:.9,pas:1,wob:.5});
  trazo(ctx,borde(3.05).map(([x,y])=>[x,y+2.5]),{w:1,col:C('#A88494'),a:.35,pas:1,wob:.5});
  trazo(ctx,borde(H_LONA+.02),{w:1.1,col:C('#1A1C2A'),a:.7,pas:1,wob:.3});
  return {nb,nbR,nl,fb,xa,xb};
}

// ================================================================ 5. POLVO DE LADRILLO
const ARCILLA=RS([[460,'#94533F'],[520,'#A65D45'],[600,'#B2654A'],[640,'#B0634A'],[770,'#AE5F44'],[1000,'#9B5242'],[1400,'#894739'],[1900,'#733B34'],[2400,'#5C2F2F']]);
function colArcilla(x,y){
